<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度學七舍樓長介紹</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 粒子背景 -->
    <div id="particles-js"></div>

    <!-- 擬真鐵灰色電梯開場/呼叫介面 -->
    <div id="elevator-screen">
        <div class="elevator-panel-box">
            <div class="elevator-display-screen">
                <span id="floor-number">1</span> <span class="floor-unit">FLOOR</span>
                <p id="elevator-status">請選擇您的目的地樓層</p>
            </div>
            
            <!-- 1~12 樓電梯按鍵矩形面板 -->
            <div class="elevator-keypad">
                <button class="floor-key" data-floor="12">12</button>
                <button class="floor-key" data-floor="11">11</button>
                <button class="floor-key" data-floor="10">10</button>
                <button class="floor-key" data-floor="9">9</button>
                <button class="floor-key" data-floor="8">8</button>
                <button class="floor-key" data-floor="7">7</button>
                <button class="floor-key" data-floor="6">6</button>
                <button class="floor-key" data-floor="5">5</button>
                <button class="floor-key" data-floor="4">4</button>
                <button class="floor-key" data-floor="3">3</button>
                <button class="floor-key" data-floor="2">2</button>
            </div>
        </div>

        <div class="elevator-doors">
            <div class="door left-door"></div>
            <div class="door right-door"></div>
        </div>
    </div>

    <!-- 主要網站內容 -->
    <div id="main-content" class="hidden">
        <header>
            <div class="logo-container">
                <img src="LOGO.jpg" alt="宿舍LOGO" class="dorm-logo" onerror="this.style.display='none'">
            </div>
            <h1>115學年度學七舍<br>樓長介紹</h1>
        </header>

        <nav class="quick-nav">
            <button id="call-elevator-btn" class="elevator-trigger-btn">
                <i class="fa-solid fa-elevator"></i> 呼叫電梯
            </button>
            <div class="nav-divider"></div>
            <div class="nav-buttons">
                <script>
                    for(let i=2; i<=12; i++) {
                        document.write(`<button class="nav-btn ${i===1?'active':''}" onclick="switchFloor(${i})">${i}F</button>`);
                    }
                </script>
            </div>
        </nav>

        <!-- 各樓層內容容器 -->
        <main class="floor-container">
            <!-- 內容會透過 JS 動態載入當前點選的樓層資訊 -->
            <div id="floor-display-area"></div>
        </main>

        <footer>
            <p>&copy; 2026 NTNU Dormitory 7. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
